version: "3"
services:
  resource-service:
    build: ../resource-spring
    container_name: "resource_service"
    # ports:
      # - "8088:8088"
    networks:
      - hale_bopp_net
    depends_on:
      - eureka


  song-service:
    build: ../song-service
    container_name: "song-service"
    # ports:
      # - "8089:8089"
    networks:
      - hale_bopp_net
    depends_on:
      - eureka


  resource-processor:
    build: ../resource-processor
    container_name: "resource-processor-service"
    # ports:
      # - "8090:8090"
    networks:
      - hale_bopp_net
    depends_on:
      - resource-service
      - song-service
      - eureka


  eureka:
    build: ../eureka-server
    container_name: "eureka-service-discovery"
    # ports:
      # - "8761:8761"
    networks:
      - hale_bopp_net


  hale-bopp-gateway:
    build: ../hale-bopp-gateway
    container_name: "gateway-service"
    ports:
      - "8000:8000"
    networks:
      - hale_bopp_net
    depends_on:
      - eureka

networks:
  hale_bopp_net:
    external: true
